# Pocket Forms — forms and surveys on your own server (Go + SQLite). One container, one volume.
services:
  pocket-forms:
    image: ghcr.io/abjelosevic88/pocket-homelab-forms:latest
    container_name: pocket-forms
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # PUBLIC_URL: https://read.example.com   # a public hostname that serves only the forms (no sign-in, no API)
      # Pocket Core: one sign-in, Pocket AI, and posts from Travel/Places/Bookshelf/Kitchen/Notes through app links.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
